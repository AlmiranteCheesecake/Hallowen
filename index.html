<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mural das Fantasias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: uma coluna estreita — convite no topo, ficha de reserva, depois o mural de etiquetas de chapelaria */
:root {
  --ink: #160f1d;
  --ink-2: #211829;
  --ink-3: #2e2238;
  --line: #43344f;
  --bone: #f1e8dc;
  --muted: #a898b3;
  --ember: #f08a3c;
  --ember-soft: #f08a3c22;
  --ok: #7fd1a0;
  --bad: #ff7a7a;
  --bad-soft: #ff7a7a1f;
  --f-display: "Pirata One", "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html { background: var(--ink); }
body {
  background: var(--ink);
  color: var(--bone);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
  background-image: radial-gradient(ellipse 80% 50% at 50% -10%, #f08a3c18, transparent 70%);
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 28px; }

header { display: grid; gap: 6px; text-align: left; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ember); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(44px, 11vw, 72px); line-height: .95; margin: 0; text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 52ch; }

.panel { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; }
.panel h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .02em; }
.field { display: grid; gap: 6px; }
label { font-size: 13px; font-weight: 600; color: var(--muted); }
input {
  font: inherit; color: var(--bone); background: var(--ink); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px; width: 100%; box-sizing: border-box;
}
input:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; border-color: var(--ember); }
.row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
@media (max-width: 520px) { .row { grid-template-columns: 1fr; } }

.hint { font-size: 14px; border-radius: 10px; padding: 10px 12px; min-height: 1.5em; }
.hint.free { color: var(--ok); background: #7fd1a014; }
.hint.taken { color: var(--bad); background: var(--bad-soft); }
.hint.near { color: var(--ember); background: var(--ember-soft); }
.hint.info { color: var(--muted); background: var(--ink-3); }

button {
  font: inherit; font-weight: 700; cursor: pointer; border-radius: 10px; border: 0;
  padding: 12px 18px; background: var(--ember); color: #1d1007;
}
button:hover { filter: brightness(1.08); }
button:disabled { opacity: .45; cursor: not-allowed; filter: none; }
button:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }
button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 10px; font-size: 13px; font-weight: 600; }
button.ghost:hover { color: var(--bad); border-color: var(--bad); }
.actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.mine { font-size: 14px; color: var(--muted); }
.mine b { color: var(--bone); }

.board-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.board-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 0; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--ember); }

.tags { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.tag {
  position: relative; background: var(--bone); color: var(--ink); border-radius: 6px 6px 10px 10px;
  padding: 26px 14px 14px; display: grid; gap: 4px; min-width: 0;
}
.tag::before { /* furo da etiqueta */
  content: ""; position: absolute; top: 9px; left: 50%; width: 10px; height: 10px; margin-left: -5px;
  border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px #00000022 inset;
}
.tag .num { font-family: var(--f-mono); font-size: 11px; color: #7a6a84; font-variant-numeric: tabular-nums; position: absolute; top: 8px; right: 10px; }
.tag .costume { font-weight: 700; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.tag .who { font-size: 13px; color: #5c4d66; overflow-wrap: anywhere; }
.tag.is-mine { outline: 3px solid var(--ember); outline-offset: -3px; }
.tag.is-new { animation: drop .5s ease-out; }
@keyframes drop { from { transform: translateY(-8px) rotate(-2deg); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .tag.is-new { animation: none; } }

.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 24px; color: var(--muted); text-align: center; }
.status { font-size: 14px; color: var(--muted); }
.status.err { color: var(--bad); }
.toast { font-size: 14px; color: var(--ok); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">1º de novembro · lista de fantasias</span>
    <h1>Mural das Fantasias</h1>
  </header>

  <form class="panel" id="form" novalidate>
    <h2>Reservar minha fantasia</h2>
    <div class="field">
      <label for="costume">Fantasia</label>
      <input id="costume" maxlength="60" placeholder="Ex.: Vampiro, Wandinha, Múmia…" required>
    </div>
    <div class="hint info" id="hint" aria-live="polite">Digite a fantasia para ver se ela está livre.</div>
    <div class="actions">
      <button type="submit" id="submit">Reservar</button>
      <span class="mine" id="mine" hidden></span>
      <button type="button" class="ghost" id="release" hidden>Liberar minha fantasia</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </form>

  <section style="display:grid;gap:14px">
    <div class="board-head">
      <h2>Já escolhidas</h2>
      <span class="count" id="count"></span>
    </div>
    <ul class="tags" id="tags"></ul>
    <div class="empty" id="empty">Carregando o mural…</div>
  </section>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const costumeEl = $("costume"), hint = $("hint"), status = $("status");
  const submitBtn = $("submit"), releaseBtn = $("release"), mineEl = $("mine");
  const tagsEl = $("tags"), emptyEl = $("empty"), countEl = $("count");
  const API = "/api/fantasias";

  // código deste navegador: é ele que diz qual fantasia é "a sua"
  let me = null;
  try { me = localStorage.getItem("fantasia-dono"); } catch (e) {}
  if (!me) {
    me = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2));
    try { localStorage.setItem("fantasia-dono", me); } catch (e) {}
  }

  let entries = [], seen = new Set(), firstLoad = true, loaded = false;

  function keyOf(text) {
    let s = (text || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
    s = s.replace(/^(o|a|os|as|um|uma|the)\s+/, "");
    s = s.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return s.slice(0, 120);
  }
  const myEntry = () => entries.find((e) => e.minha);

  function updateHint() {
    const k = keyOf(costumeEl.value);
    if (!k) { hint.className = "hint info"; hint.textContent = "Digite a fantasia para ver se ela está livre."; return; }
    const exact = entries.find((e) => e.chave === k);
    if (exact) {
      hint.className = exact.minha ? "hint info" : "hint taken";
      hint.textContent = exact.minha ? "Essa já é a sua fantasia." : "Essa já foi escolhida. Escolha outra.";
      return;
    }
    const near = k.length >= 4 ? entries.filter((e) => e.chave.includes(k) || k.includes(e.chave)).slice(0, 3) : [];
    if (near.length) { hint.className = "hint near"; hint.textContent = "Livre, mas parecida com: " + near.map((e) => e.fantasia).join(", ") + "."; return; }
    hint.className = "hint free"; hint.textContent = "Livre! Pode reservar.";
  }

  function render() {
    const mine = myEntry();
    tagsEl.textContent = "";
    entries.forEach((e, i) => {
      const li = document.createElement("li");
      li.className = "tag" + (e.minha ? " is-mine" : "") + (!firstLoad && !seen.has(e.chave) ? " is-new" : "");
      const num = document.createElement("span"); num.className = "num"; num.textContent = "nº " + String(i + 1).padStart(2, "0");
      const c = document.createElement("span"); c.className = "costume"; c.textContent = e.fantasia;
      li.append(num, c);
      if (e.minha) { const w = document.createElement("span"); w.className = "who"; w.textContent = "a sua"; li.append(w); }
      tagsEl.append(li);
    });
    entries.forEach((e) => seen.add(e.chave));
    if (loaded) firstLoad = false;
    emptyEl.hidden = entries.length > 0;
    if (!entries.length && loaded) emptyEl.textContent = "Ninguém reservou ainda. Seja o primeiro a escolher!";
    countEl.innerHTML = `<b>${entries.length}</b> ${entries.length === 1 ? "fantasia reservada" : "fantasias reservadas"}`;
    if (mine) {
      mineEl.hidden = false; releaseBtn.hidden = false;
      mineEl.textContent = "Você vai de ";
      const b = document.createElement("b"); b.textContent = mine.fantasia; mineEl.append(b, ".");
      submitBtn.textContent = "Trocar fantasia";
    } else { mineEl.hidden = true; releaseBtn.hidden = true; submitBtn.textContent = "Reservar"; }
    updateHint();
  }

  function setStatus(text, err) { status.className = err ? "status err" : "status toast"; status.textContent = text; }

  async function load() {
    try {
      const r = await fetch(API + "?dono=" + encodeURIComponent(me), { cache: "no-store" });
      if (!r.ok) throw new Error();
      entries = await r.json(); loaded = true; render();
    } catch (e) {
      if (!loaded) { emptyEl.hidden = false; emptyEl.textContent = "Não deu para carregar o mural. Recarregue a página."; }
    }
  }

  async function send(method, payload) {
    const r = await fetch(API, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ dono: me }, payload)) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.erro || "Não deu para salvar agora. Tente de novo.");
    return data;
  }

  $("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const costume = costumeEl.value.trim().replace(/\s+/g, " ");
    if (!keyOf(costume)) { setStatus("Escreva qual é a fantasia.", true); costumeEl.focus(); return; }
    submitBtn.disabled = true; setStatus("Reservando…");
    try {
      const d = await send("POST", { fantasia: costume });
      setStatus(`Reservado! Você vai de ${d.fantasia}.`); costumeEl.value = "";
    } catch (e) { setStatus(e.message, true); }
    finally { submitBtn.disabled = false; load(); }
  });

  releaseBtn.addEventListener("click", async () => {
    const mine = myEntry(); if (!mine) return;
    releaseBtn.disabled = true;
    try { await send("DELETE", {}); setStatus(`"${mine.fantasia}" está livre de novo.`); }
    catch (e) { setStatus(e.message, true); }
    finally { releaseBtn.disabled = false; load(); }
  });

  costumeEl.addEventListener("input", updateHint);
  render(); load();
  setInterval(() => { if (!document.hidden) load(); }, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
